{% extends "base.html" %}
{% set active = "catalog" %}
{% block title %}{{ "Изменить товар" if item else "Новый товар" }}{% endblock %}
{% block content %}
<h1>{{ "Изменить товар" if item else "Новый товар" }}</h1>
<div class="card" style="max-width:560px;">
  <form method="post" action="{{ '/console/catalog/%d/edit' % item.id if item else '/console/catalog/new' }}">
    <label>Категория</label>
    <select name="category">
      {% for c in categories %}
      <option value="{{ c }}" {{ "selected" if item and item.category == c else "" }}>{{ category_labels.get(c, c) }}</option>
      {% endfor %}
    </select>

    <label>Название</label>
    <input name="title" value="{{ item.title if item else '' }}" required>

    <label>Описание</label>
    <textarea name="description" rows="3">{{ item.description if item else '' }}</textarea>

    <label>Цена (so'm)</label>
    <input name="price_uzs" type="number" step="0.01" value="{{ item.price_uzs if item else '' }}" required>

    <label>Скидка (%)</label>
    <input name="discount_percent" type="number" min="0" max="100" value="{{ item.discount_percent if item else 0 }}">

    <label>Остаток (пусто = не ограничен)</label>
    <input name="stock" type="number" min="0" value="{{ item.stock if item and item.stock is not none else '' }}">

    <label>Ссылка на изображение</label>
    <input name="image_url" value="{{ item.image_url if item else '' }}">

    <label>Варианты длительности (JSON, необязательно)</label>
    <textarea name="duration_options" rows="2" placeholder='{"months": 3}'>{{ (item.duration_options | tojson) if item and item.duration_options else '' }}</textarea>

    <label style="display:flex; align-items:center; gap:8px; margin-top:4px;">
      <input type="checkbox" name="active" style="width:auto; margin:0;" {{ "checked" if (item is none) or item.active else "" }}>
      Активен (виден в магазине)
    </label>

    <div style="margin-top:16px; display:flex; gap:10px;">
      <button class="btn btn-primary" type="submit"><i class="ti ti-device-floppy"></i>Сохранить</button>
      <a class="btn" href="/console/catalog"><i class="ti ti-x"></i>Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
