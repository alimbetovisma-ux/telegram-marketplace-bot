<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Console{% endblock %} — Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css">
<style>
  :root {
    --bg: #f5f6fa; --surface: #ffffff; --surface2: #f0f1f7; --border: #e5e7f0;
    --text: #14151f; --dim: #70728a; --accent: #6d5bf6; --accent2: #9b7bff;
    --danger: #ef4757; --success: #17b978; --warning: #f5a524;
    --radius: 14px; --shadow: 0 1px 2px rgba(20,21,31,.04), 0 8px 24px rgba(20,21,31,.05);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Inter',-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
  a { color:inherit; text-decoration:none; }
  .layout { display:flex; min-height:100vh; }
  nav { width:236px; background:var(--surface); border-right:1px solid var(--border); padding:24px 14px; flex-shrink:0; display:flex; flex-direction:column; }
  nav .brand { display:flex; align-items:center; gap:10px; padding:0 10px 24px; font-weight:700; font-size:17px; }
  nav .brand i { font-size:22px; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  nav a.link { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; color:var(--dim); font-size:14px; font-weight:500; margin-bottom:2px; transition:background .15s ease, color .15s ease, transform .1s ease; }
  nav a.link i { font-size:18px; width:20px; text-align:center; }
  nav a.link:hover { background:var(--surface2); color:var(--text); transform:translateX(2px); }
  nav a.link.active { background:linear-gradient(135deg,rgba(109,91,246,.12),rgba(155,123,255,.12)); color:var(--accent); }
  nav .spacer { flex:1; }
  nav .who { padding:10px 12px; font-size:12px; color:var(--dim); border-top:1px solid var(--border); margin-top:8px; }
  nav .logout { display:flex; align-items:center; gap:8px; padding:10px 12px; font-size:13px; color:var(--dim); border-radius:10px; transition:background .15s ease,color .15s ease; }
  nav .logout:hover { background:var(--surface2); color:var(--danger); }
  main { flex:1; padding:32px 40px; max-width:1080px; }
  h1 { margin:0 0 20px; font-size:24px; font-weight:700; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:24px; }
  .stat { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); transition:transform .15s ease, box-shadow .15s ease; }
  .stat:hover { transform:translateY(-2px); box-shadow:0 4px 8px rgba(20,21,31,.06), 0 12px 28px rgba(20,21,31,.08); }
  .stat .num { font-size:28px; font-weight:700; }
  .stat .label { color:var(--dim); font-size:12px; margin-top:4px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:12px 14px; border-bottom:1px solid var(--border); font-size:14px; }
  th { color:var(--dim); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
  tbody tr { transition:background .12s ease; }
  tbody tr:hover { background:var(--surface2); }
  .btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:10px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; background:var(--surface); color:var(--text); transition:transform .1s ease, box-shadow .15s ease, background .15s ease; font-family:inherit; }
  .btn:hover { transform:translateY(-1px); box-shadow:0 4px 10px rgba(20,21,31,.08); }
  .btn:active { transform:translateY(0) scale(.98); }
  .btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:none; }
  .btn-danger { color:var(--danger); }
  form.inline { display:inline; }
  input, textarea, select { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:14px; margin-bottom:12px; font-family:inherit; transition:border-color .15s ease, box-shadow .15s ease; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(109,91,246,.14); }
  label { font-size:12px; font-weight:600; color:var(--dim); display:block; margin-bottom:6px; }
  .badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:600; }
  .badge-ok { background:rgba(23,185,120,.12); color:var(--success); }
  .badge-bad { background:rgba(239,71,87,.12); color:var(--danger); }
  .flash { display:flex; align-items:center; gap:8px; background:rgba(23,185,120,.12); color:var(--success); padding:12px 16px; border-radius:10px; margin-bottom:18px; font-size:14px; font-weight:500; }
  .thumb { width:40px; height:40px; border-radius:8px; object-fit:cover; background:var(--surface2); }
  .empty { color:var(--dim); font-size:14px; padding:24px 0; text-align:center; }
</style>
</head>
<body>
<div class="layout">
  <nav>
    <div class="brand"><i class="ti ti-sparkles"></i>Console</div>
    <a class="link {{ 'active' if active == 'dashboard' else '' }}" href="/console"><i class="ti ti-layout-dashboard"></i>Дашборд</a>
    <a class="link {{ 'active' if active == 'catalog' else '' }}" href="/console/catalog"><i class="ti ti-shopping-bag"></i>Товары и цены</a>
    <a class="link {{ 'active' if active == 'gifts' else '' }}" href="/console/gifts"><i class="ti ti-gift"></i>NFT-подарки</a>
    <div class="spacer"></div>
    <div class="who"><i class="ti ti-user-circle"></i> {{ email }}</div>
    <a class="logout" href="/console/logout"><i class="ti ti-logout"></i>Выйти</a>
  </nav>
  <main>
    {% if request.query_params.get('ok') %}<div class="flash"><i class="ti ti-circle-check"></i>Готово.</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
