<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Admin{% endblock %} — Marketplace</title>
<style>
  :root { --bg:#0b0e14; --surface:#141824; --surface2:#1b2030; --border:#262c3d; --text:#f4f6fb; --dim:#8891a5; --accent:#4d9eff; --danger:#ff5c72; --success:#3ddc84; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
  a { color: var(--accent); text-decoration: none; }
  .layout { display:flex; min-height:100vh; }
  nav { width:220px; background:var(--surface); border-right:1px solid var(--border); padding:20px 0; flex-shrink:0; }
  nav .brand { padding:0 20px 20px; font-weight:700; font-size:18px; }
  nav a { display:block; padding:10px 20px; color:var(--dim); font-size:14px; }
  nav a:hover, nav a.active { color:var(--text); background:var(--surface2); }
  main { flex:1; padding:28px 32px; max-width:1100px; }
  h1 { margin-top:0; font-size:22px; }
  table { width:100%; border-collapse:collapse; margin-top:16px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); font-size:14px; }
  th { color:var(--dim); font-weight:600; font-size:12px; text-transform:uppercase; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
  .stat { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; }
  .stat .num { font-size:26px; font-weight:700; }
  .stat .label { color:var(--dim); font-size:12px; margin-top:4px; }
  .btn { display:inline-block; border:none; border-radius:8px; padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-danger { background:var(--danger); color:#fff; }
  .btn-ghost { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
  form.inline { display:inline; }
  input, textarea, select { width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:14px; margin-bottom:10px; }
  label { font-size:12px; color:var(--dim); display:block; margin-bottom:4px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; }
  .badge-pending { background:rgba(255,193,77,.15); color:#ffc14d; }
  .badge-ok { background:rgba(61,220,132,.15); color:var(--success); }
  .badge-bad { background:rgba(255,92,114,.15); color:var(--danger); }
  .flash { background:rgba(61,220,132,.15); color:var(--success); padding:10px 14px; border-radius:8px; margin-bottom:16px; }
</style>
</head>
<body>
<div class="layout">
  <nav>
    <div class="brand">🛠 Admin</div>
    <a href="/admin">Дашборд</a>
    <a href="/admin/topups">Пополнения</a>
    <a href="/admin/orders">Заказы</a>
    <a href="/admin/catalog">Каталог</a>
    <a href="/admin/assets">Активы аренды</a>
    <a href="/admin/listings">P2P-объявления</a>
    <a href="/admin/deals">P2P-споры</a>
    <a href="/admin/settings">Настройки</a>
  </nav>
  <main>
    {% if request.query_params.get('ok') %}<div class="flash">Готово.</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
